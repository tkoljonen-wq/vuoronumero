<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR – Näöntarkastus</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&family=Roboto+Flex:opsz,wght@8..144,400;8..144,600&display=swap" rel="stylesheet">
  <style>
    :root { --violet:#9A5EA3; --ink:#323232; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:'Roboto Flex',Arial,sans-serif; color:var(--ink);
           min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
    .poster { text-align:center; max-width:520px; width:100%; }
    img.logo { height:64px; margin-bottom:24px; }
    h1 { font-family:'Roboto Condensed',sans-serif; color:var(--violet); font-size:40px; margin:0 0 6px; }
    h2 { font-family:'Roboto Condensed',sans-serif; color:var(--ink); font-weight:400; font-size:24px; margin:0 0 28px; }
    .qr { background:#fff; border:8px solid var(--violet); border-radius:24px; padding:20px; display:inline-block; }
    .qr img { width:300px; height:300px; display:block; }
    .url { margin-top:22px; font-size:18px; color:var(--violet); font-weight:600; word-break:break-all; }
    .sub { margin-top:8px; color:#6B6470; font-size:15px; }
    @media print { body { padding:0; } .noprint { display:none; } }
  </style>
</head>
<body>
  <div class="poster">
    <img class="logo" src="icons/logo.svg" alt="Näöntarkastus">
    <h1>Näöntarkastus</h1>
    <h2>Skannaa ja ilmoittaudu &middot; Scan to join</h2>
    <div class="qr"><img src="qr.svg" alt="QR-koodi"></div>
    <div class="url">tkoljonen-wq.github.io/vuoronumero</div>
    <div class="sub">Ei kirjautumista &middot; e-sports &middot; Silmäasema</div>
  </div>
</body>
</html>
